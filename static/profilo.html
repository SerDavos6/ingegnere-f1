<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="/icon-192.png">
<title>Profilo pilota</title>
<style>
  :root { --bg:#0b0d10; --panel:#14181d; --line:#232a32; --txt:#e8edf2; --dim:#8b96a2; --accent:#e10600; --good:#4cc38a; --bad:#ff5b5b; --gold:#ffd24a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--txt); font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif; }
  body { padding:max(10px, env(safe-area-inset-top)) 12px 30px; display:flex; flex-direction:column; gap:10px; max-width:820px; margin:0 auto; }
  header { display:flex; gap:10px; align-items:center; }
  header h1 { font-size:15px; letter-spacing:.08em; text-transform:uppercase; } header h1 b { color:var(--accent); }
  a.back { color:var(--dim); text-decoration:none; font-size:14px; border:1px solid var(--line); padding:8px 12px; border-radius:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat { text-align:center; } .stat b { display:block; font-size:24px; font-weight:800; } .stat small { color:var(--dim); font-size:12px; }
  .bar { height:10px; background:#0c0e11; border-radius:6px; overflow:hidden; margin:4px 0 10px; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:6px; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:14px; }
  .trk + .trk { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .trk h3 { font-size:15px; display:flex; justify-content:space-between; gap:8px; }
  .trk h3 small { color:var(--dim); font-weight:400; font-size:12px; }
  .c { font-size:14px; line-height:1.5; color:var(--txt); }
  .c .dim, .dim { color:var(--dim); }
  .mono { font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
  .empty { color:var(--dim); padding:30px 10px; text-align:center; line-height:1.5; }
  .good { color:var(--good); } .bad { color:var(--bad); }
  #trend { width:100%; height:120px; display:block; }
  @media (max-width:420px) { .stats { grid-template-columns:repeat(2,1fr); } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stile.css">
</head>
<body>
<header><a class="back" aria-label="Indietro" href="/">‹ Indietro</a><h1>Profilo <b>pilota</b></h1></header>
<div id="main"><div class="empty">Carico tutti i tuoi giri…</div></div>
<script>
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const fmt = ms => { if (!ms) return "–"; const m = Math.floor(ms / 60000); return m + ":" + ((ms % 60000) / 1000).toFixed(3).padStart(6, "0"); };
const ADVICE = {
  frenata: "Prova a frenare più tardi: in Analisi usa «Come freno?» per vedere dove, e in Impostazioni scegli «Su cosa lavorare: Frenata».",
  centro: "Rilascia il freno prima e lascia scorrere la macchina: «Su cosa lavorare: Centro curva».",
  uscita: "Dai gas pieno prima, raddrizzando lo sterzo: «Su cosa lavorare: Uscita».",
  traiettoria: "Frenata e velocità sono giuste ma perdi lo stesso: confronta la traiettoria sulla mappa in Analisi con il tuo giro migliore o quello di un amico.",
};
async function load() {
  const r = await fetch("/api/profilo").then(r => r.json()).catch(() => null);
  const box = document.getElementById("main");
  if (!r || !r.laps) { box.innerHTML = '<div class="card empty">Ancora pochi giri: fai qualche sessione e qui trovi i tuoi punti forti e deboli.</div>'; return; }
  const g = r.races || {};
  let h = `<div class="card"><div class="lbl">Risultati</div><div class="stats">
    <div class="stat"><b>${g.races || 0}</b><small>gare</small></div>
    <div class="stat"><b style="color:var(--gold)">${g.wins || 0}</b><small>vittorie</small></div>
    <div class="stat"><b>${g.podiums || 0}</b><small>podi</small></div>
    <div class="stat"><b>${g.avg_finish ?? "–"}</b><small>arrivo medio</small></div></div>
    <div class="dim" style="font-size:13px;margin-top:8px">${r.laps} giri analizzati${g.dnf ? ` · ${g.dnf} ritiri` : ""}${r.best_track ? ` · pista migliore: <b style="color:var(--txt)">${esc(r.best_track)}</b>` : ""}${r.worst_track ? ` · da migliorare: <b style="color:var(--txt)">${esc(r.worst_track)}</b>` : ""}</div></div>`;
  if (r.weak && r.weak.length) {
    h += `<div class="card"><div class="lbl">Dove lasci il tempo, su tutte le piste</div>` + r.weak.map(w => `
      <div class="row"><span>${esc(w.label)}</span><b class="mono">${w.share}%</b></div><div class="bar"><i style="width:${w.share}%"></i></div>`).join("") +
      `<div class="c"><b>Il tuo punto debole:</b> ${esc(r.weak[0].label.toLowerCase())}. <span class="dim">${esc(ADVICE[r.weak[0].kind] || "")}</span></div></div>`;
  }
  if (r.trend && r.trend.length >= 2) {
    h += `<div class="card"><div class="lbl">Tempo lasciato nelle curve, a giro</div><canvas id="trend"></canvas>
      <div class="c" style="margin-top:6px">${r.improving ? (r.improving.after < r.improving.before
        ? `<span class="good">Stai migliorando</span>: da ${r.improving.before.toFixed(2)} s a ${r.improving.after.toFixed(2)} s a giro.`
        : `Per ora stabile o in crescita: da ${r.improving.before.toFixed(2)} s a ${r.improving.after.toFixed(2)} s a giro.`) : "Servono qualche sessione in più per vedere la tendenza."}
      <span class="dim">Confronto con il tuo riferimento di quel momento (in gara con il tuo passo).</span></div></div>`;
  }
  const rec = {}; (r.records || []).forEach(x => rec[x.track + "|" + x.category_name] = x);
  if (r.tracks && r.tracks.length) {
    h += `<div class="card"><div class="lbl">Per pista</div>` + r.tracks.map(t => {
      const x = rec[t.track + "|" + t.category_name];
      return `<div class="trk"><h3><span>${esc(t.track)} <small>${esc(t.category_name)}</small></span>
        <span class="mono">${x ? fmt(x.ms) : ""}${x && x.gained_ms > 0 ? ` <small class="good">−${(x.gained_ms / 1000).toFixed(2)}</small>` : ""}</span></h3>
        <div class="c dim">${t.laps} giri${t.main ? ` · soprattutto: ${esc(t.main.toLowerCase())} (${t.main_share}%)` : ""}</div>
        ${t.corners.length ? '<div class="c" style="margin-top:4px">' + t.corners.map(c =>
          `· <b>${esc(c.name[0].toUpperCase() + c.name.slice(1))}</b>: ${c.avg.toFixed(2)} s a giro <span class="dim">— ${esc(c.tip.toLowerCase())}</span>`).join("<br>") + "</div>" : ""}</div>`;
    }).join("") + `</div>`;
  }
  box.innerHTML = h;
  const cv = document.getElementById("trend");
  if (cv) {
    const W = cv.clientWidth, H = cv.clientHeight, dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    const x = cv.getContext("2d"); x.scale(dpr, dpr);
    const v = r.trend.map(t => t.loss_per_lap), mx = Math.max(...v) * 1.15 || 1;
    x.strokeStyle = "#232a32"; x.beginPath(); x.moveTo(0, H - 14); x.lineTo(W, H - 14); x.stroke();
    x.strokeStyle = "#e10600"; x.lineWidth = 2.5; x.beginPath();
    v.forEach((y, i) => { const px = 10 + i * (W - 20) / Math.max(1, v.length - 1), py = (H - 18) - y / mx * (H - 28);
      i ? x.lineTo(px, py) : x.moveTo(px, py); });
    x.stroke();
    x.fillStyle = "#8b96a2"; x.font = "11px sans-serif";
    x.fillText(v[0].toFixed(2) + " s", 4, 12); x.textAlign = "right"; x.fillText(v[v.length - 1].toFixed(2) + " s", W - 4, 12);
  }
}
load();
</script>
</body>
</html>
